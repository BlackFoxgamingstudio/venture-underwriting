version: "3.9"
# Sovereign Venture Underwriting — docker-compose
# Usage: docker-compose up --build

services:
  venture-underwriting:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-venture-underwriting:latest
    container_name: sovereign-venture-underwriting
    restart: unless-stopped
    ports:
      - "8795:8795"
    environment:
      SBB_LLM_API_KEY: ${SBB_LLM_API_KEY}
      SBB_CRUNCHBASE_API_KEY: ${SBB_CRUNCHBASE_API_KEY}
      SBB_VALUATION_MODEL: ${SBB_VALUATION_MODEL}
      SBB_RISK_THRESHOLD: ${SBB_RISK_THRESHOLD}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8795
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8795/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
