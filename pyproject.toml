[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-venture-underwriting"
version = "1.0.0"
description = "Institutional fintech underwriting and investor data room engine. Programmatically models venture capital equity dilution, convertible debt, 10-year pro forma cash flows, and automated investor data room provisioning with NDA compliance tracking."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "fintech & capital underwriting", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-venture-underwriting = "src.cli:main"
